apply plugin: 'com.android.application'

// The version Google Play sees: versionCode must go up by at least 1 for every upload,
// versionName is what players read. Both live in android/version.properties; a build
// can override them with -PversionCode=… -PversionName=…
def findFile = { String filename ->
    def f = rootProject.file("android/${filename}")
    if (!f.exists()) {
        f = rootProject.file(filename)
    }
    return f
}

def versionProps = new Properties()
def versionPropsFile = findFile('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (project.findProperty('versionCode') ?: versionProps.getProperty('versionCode')) as Integer
def appVersionName = (project.findProperty('versionName') ?: versionProps.getProperty('versionName')) as String

def keystoreProps = new Properties()
def keystorePropsFile = findFile('keystore.properties')
if (!keystorePropsFile.exists()) {
    keystorePropsFile = findFile('keystore.properties.txt')
}
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')
def canSignRelease = releaseStoreFile && signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD') && signingValue('keyAlias', 'ANDROID_KEY_ALIAS') && signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')

// The AdMob app id (rewarded ads): from your AdMob account, as -PadmobAppId=… or the
// ADMOB_APP_ID variable (docs/android/ads.md). Without one, Google's sample app id:
// the app then shows test ads only, which pay nothing. Never invent one.
def admobSampleAppId = 'ca-app-pub-3940256099942544~3347511713'
def admobAppIdGiven = (project.findProperty('admobAppId') ?: System.getenv('ADMOB_APP_ID') ?: '') as String
// An app id has a "~" (ca-app-pub-...~...). An ad unit id ("/") or anything else in its place makes
// Google Mobile Ads stop the app as it launches, before the game runs: the sample id instead.
def admobAppIdValid = admobAppIdGiven ==~ /ca-app-pub-\d+~\d+/
def admobAppId = admobAppIdValid ? admobAppIdGiven : admobSampleAppId

android {
    namespace = "com.zazochannel.idlecarempire"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.zazochannel.idlecarempire"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [admobAppId: admobAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // CI signs debug builds with a debug key of its own, kept from run to run (android.yml),
        // so a newer test APK installs over an older one. Elsewhere: Android's usual debug key.
        def debugKeystore = System.getenv('ANDROID_DEBUG_KEYSTORE')
        if (debugKeystore) {
            debug {
                storeFile file(debugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (canSignRelease) {
            release {
                def storeFileObj = rootProject.file("android/${releaseStoreFile}")
                if (!storeFileObj.exists()) {
                    storeFileObj = rootProject.file(releaseStoreFile)
                }
                storeFile storeFileObj
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // a test build installs next to the Google Play one instead of replacing it
            // (its own icon, its own saves)
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // R8 shrinks and obfuscates the Java/Kotlin code; the bundle carries its mapping file, so Play
            // Console shows readable crashes and ANRs (Android vitals). Native debug symbols go in too where a
            // library has them (androidx.datastore's tiny one comes stripped: Play's note about it is harmless)
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

if (admobAppIdGiven && !admobAppIdValid) {
    logger.warn("ADMOB_APP_ID is not an AdMob app id (ca-app-pub-...~..., from AdMob > Apps > App settings): '${admobAppIdGiven}'" +
        (admobAppIdGiven.contains('/') ? " is an ad unit id" : "") + ". This build uses Google's sample app id instead (test ads only).")
} else if (admobAppId == admobSampleAppId) {
    logger.lifecycle("No AdMob app id (ADMOB_APP_ID or -PadmobAppId): this build shows Google's test ads only.")
}

if (!canSignRelease) {
    logger.lifecycle("No upload key configured (android/keystore.properties or ANDROID_KEYSTORE_* variables): release builds will be unsigned.")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
