// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    beforeEvaluate { proj ->
        def buildFile = proj.buildFile
        if (buildFile != null && buildFile.exists()) {
            def text = buildFile.text
            def modified = false

            if (proj.name == 'capacitor-community-admob') {
                if (text.contains("apply plugin: 'kotlin-android'")) {
                    text = text.replace("apply plugin: 'kotlin-android'", "// apply plugin: 'kotlin-android'")
                    modified = true
                }
                if (text.contains("kotlinOptions")) {
                    text = text.replace("    kotlinOptions {\n        jvmTarget = JavaVersion.VERSION_21\n    }", "    kotlin {\n        jvmToolchain(21)\n    }")
                    modified = true
                }
            }

            if (text.contains("proguard-android.txt")) {
                text = text.replace("proguard-android.txt", "proguard-android-optimize.txt")
                modified = true
            }

            if (modified) {
                buildFile.text = text
            }
        }
    }

    project.afterEvaluate { proj ->
        if (proj.hasProperty('android')) {
            proj.android {
                if (compileSdk == null && rootProject.hasProperty('compileSdkVersion')) {
                    compileSdk = rootProject.ext.compileSdkVersion
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
