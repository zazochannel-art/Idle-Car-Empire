name: Cloud save (live check)

# Runs scripts/cloud-e2e.mjs against the players' Supabase project with its public key: test
# players saving, restoring, conflicts and access rules. Only on demand (Actions → Cloud save
# (live check) → Run workflow), for instance right after `supabase db push`: pull requests and
# main are checked on a local copy of the database instead (database.yml), so they never add
# accounts to the live project.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/cloud-e2e.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://orffhhsogoymalyogfzl.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_hqGfNt6uaNbq0AgGyp0I8g_QLjjFaJ-' }}
