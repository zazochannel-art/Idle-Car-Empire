name: Publish to Google Play

# Builds the signed release bundle and uploads it to a Google Play track, with the release
# notes (fastlane/metadata/android/<language>/changelogs/<versionCode>.txt) and, when asked,
# the store listing's texts and images. Only on demand (Actions → Publish to Google Play →
# Run workflow), and only with the repository's secrets: the upload key (ANDROID_KEYSTORE_*,
# docs/android/signing.md) and a Google Play service account (PLAY_SERVICE_ACCOUNT_JSON,
# docs/android/play-store.md, "Uploading from GitHub").
# Google's API only adds to an app that already has a bundle: the very first upload is made by
# hand in Play Console. Every upload needs a new versionCode (android/version.properties).
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Track (internal: up to 100 testers, minutes to go live)"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Release status (draft: you review and roll it out in Play Console; an app never published takes drafts only)"
        type: choice
        options: [draft, completed]
        default: draft
      listing:
        description: "Also upload the store listing (texts, icon, feature graphic, screenshots)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: The secrets it needs
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64 (the upload key, docs/android/signing.md)"
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON (docs/android/play-store.md)"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - run: npm ci
      - name: Build the game for the app
        run: npm run build:android
        env:
          # the same public values as android.yml (the store build has no test-build number)
          NEXT_PUBLIC_SUPABASE_URL: https://orffhhsogoymalyogfzl.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_hqGfNt6uaNbq0AgGyp0I8g_QLjjFaJ-
          NEXT_PUBLIC_ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
          NEXT_PUBLIC_IAP_STARTER_ID: ${{ vars.IAP_STARTER_ID }}
          NEXT_PUBLIC_IAP_ADFREE_ID: ${{ vars.IAP_ADFREE_ID }}
          NEXT_PUBLIC_PASSWORD_RESET: ${{ vars.PASSWORD_RESET }}
          # this build's source maps, kept below as an artifact (not in the app) to read players' error reports
          SOURCE_MAPS: "1"
      - name: Upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Signed release bundle
        working-directory: android
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          # a wrong AdMob app id would fall back to Google's test one: not in a release for players
          if [ -n "$ADMOB_APP_ID" ] && ! echo "$ADMOB_APP_ID" | grep -qE '^ca-app-pub-[0-9]+~[0-9]+$'; then
            echo "::error::Set the ADMOB_APP_ID variable to your AdMob app id, ca-app-pub-…~… (AdMob → Apps → App settings; an ad unit id has a / instead): docs/android/ads.md"
            exit 1
          fi
          ./gradlew --no-daemon --stacktrace bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified" || { echo "::error::the bundle is not signed"; exit 1; }
          grep -E "versionCode|versionName" version.properties
      - name: Release notes for this version
        run: |
          code=$(sed -n 's/^versionCode=//p' android/version.properties)
          for lang in fastlane/metadata/android/*/; do
            [ -f "$lang/changelogs/$code.txt" ] || { echo "::error::No release notes $lang""changelogs/$code.txt"; exit 1; }
          done
      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
          LISTING: ${{ inputs.listing }}
        run: |
          sudo gem install fastlane --no-document --quiet
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          skip=true
          [ "$LISTING" = "true" ] && skip=false
          fastlane supply \
            --package_name com.zazochannel.idlecarempire \
            --json_key "$RUNNER_TEMP/play.json" \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --track "$TRACK" \
            --release_status "$STATUS" \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true \
            --skip_upload_changelogs false \
            --skip_upload_metadata "$skip" \
            --skip_upload_images "$skip" \
            --skip_upload_screenshots "$skip"
          rm -f "$RUNNER_TEMP/play.json"
      - uses: actions/upload-artifact@v4
        with:
          name: idle-car-empire-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      # the uploaded build's scripts and source maps, 90 days: node scripts/error-place.mjs reads a report's place with them
      - uses: actions/upload-artifact@v4
        with:
          name: source-maps
          path: source-maps
          retention-days: 90
          if-no-files-found: warn
