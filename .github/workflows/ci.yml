name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # known vulnerabilities in what ships in the app (not the dev tools): a warning, never a
      # stopped build, since a fix can need an upgrade that waits for its own pull request
      - name: Dependencies' known vulnerabilities
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::warning title=npm audit::A dependency the app ships has a known high or critical vulnerability (npm audit --omit=dev above)"
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  first-minutes:
    name: A new player's first minutes (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # the game built against a fake Supabase that the test answers itself: nothing reaches the real project
      - name: Build against a fake Supabase
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-public-key
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      # welcome page → account → tutorial → first body → first cloud save (e2e/first-minutes.mjs)
      - name: Play the first minutes
        run: npm run e2e
      # the game open in two tabs: only the newest saves, "Play here" takes over (e2e/two-tabs.mjs)
      - name: Two tabs, one game
        run: npm run e2e:tabs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-minutes
          path: e2e-results
          if-no-files-found: ignore
